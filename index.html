<style>

:root{color-scheme:light;--ink:#1d1236;--pink:#ff4d8d;--acc:#ffd23f;--mint:#16d39a;--sky:#2e9bff}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d1236;color:var(--ink);font:16px/1.35 "Jua",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
#vid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
#gl,#cc{position:fixed;inset:0;width:100%;height:100%;display:block}
#cc{pointer-events:none}#cc.on{pointer-events:auto}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud.on{display:block}
#hud button{pointer-events:auto}
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:linear-gradient(rgba(20,10,50,.55),rgba(20,10,50,0))}

.sl{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.88);border:3px solid #fff;overflow:hidden;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.sl img{width:100%;height:100%;display:block;filter:brightness(0) opacity(.55)}
.sl.ok{border-color:var(--mint);background:#fff}.sl.ok img{filter:none}
.sl.ok::after{content:"✓";position:absolute;right:-2px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--mint);color:#fff;font-size:13px;display:grid;place-items:center;line-height:1}
.hb{min-height:44px;border-radius:14px;padding:0 12px;font-size:17px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.hb.s{width:44px;padding:0}
#reticle{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid rgba(255,255,255,.85);box-shadow:0 0 0 2px rgba(29,18,54,.35);display:none}
#reticle::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff}
#arrow{position:absolute;left:50%;top:50%;width:0;height:0;display:none}
#arrow i{position:absolute;left:-28px;top:-150px;width:56px;height:56px;display:block;transform-origin:28px 150px}
#arrow svg{width:56px;height:56px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:30px 12px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(rgba(20,10,50,0),rgba(20,10,50,.62))}
#meter{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 12px 8px;margin-bottom:10px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
#mTxt{display:block;font-size:20px;text-align:center}
#meter .bar{height:14px;border-radius:9px;background:#e8e4f5;overflow:hidden;margin-top:4px}
#mFill{display:block;height:100%;width:0;border-radius:9px;transition:width .2s,background .2s}
.brow{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.bb{min-height:60px;border-radius:20px;font-size:20px;border:4px solid var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.4);color:var(--ink);line-height:1.1}
.bb.a{background:var(--acc)}.bb.b{background:#9fe7d6}
.bb:disabled{filter:grayscale(.6) brightness(.9)}
.bb:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.4)}
#tip{margin:8px 0 0;text-align:center;font-size:15px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#msg{position:fixed;left:0;right:0;top:24%;text-align:center;pointer-events:none;font-size:46px;color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;opacity:0;z-index:15}
#msg.on{animation:pop 1.5s both}
@keyframes pop{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:14}
.screen{position:fixed;inset:0;z-index:20;display:none;overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.screen.on{display:block}
#title{background:linear-gradient(#53c7ff,#b9ecff 45%,#ffe9a8);text-align:center;touch-action:pan-y}
#title .wrap{max-width:420px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:6px 0}
#title h1{margin:0;font-weight:400;font-size:46px;line-height:1.05;color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;transform:rotate(-2deg)}
#title .sub{margin:0;font-size:19px}
.fr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fr img{width:100%;aspect-ratio:1;display:block;background:rgba(255,255,255,.55);border-radius:18px;border:3px solid #fff}
.how{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px 14px;text-align:left;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.how div{display:flex;gap:10px;align-items:center;padding:3px 0}.how b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:400}
.safe{margin:0;font-size:14px;color:#5a4a86}
.btn{display:block;width:100%;min-height:62px;border-radius:22px;background:var(--acc);color:var(--ink);font-size:26px;border:4px solid var(--ink);box-shadow:0 7px 0 #b88d00}
.btn:active{transform:translateY(3px);box-shadow:0 4px 0 #b88d00}
.btn.sub{background:#fff;font-size:18px;min-height:48px;box-shadow:0 5px 0 rgba(0,0,0,.25);margin-top:2px}
.btn:disabled{filter:grayscale(.6)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;display:none;padding:0 12px calc(env(safe-area-inset-bottom) + 12px)}
.sheet.on{display:block}
.card{background:#fff;border:4px solid var(--ink);border-radius:26px;padding:14px 16px 16px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.3);max-width:420px;margin:0 auto}
.card h3{margin:2px 0 2px;font-weight:400;font-size:32px}
.card p{margin:0}
.stars{color:#ffb300;font-size:28px;letter-spacing:3px}
#done{background:rgba(29,18,54,.82);display:none;align-items:center;justify-content:center}
#done.on{display:flex}

.row6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0}

#colS{background:linear-gradient(#53c7ff,#fff3c4);touch-action:pan-y}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:10px}

.x{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--ink);font-size:22px;border:3px solid var(--ink)}

.ci{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px;text-align:center;position:relative}

.ci .n{position:absolute;top:6px;right:6px;background:var(--pink);color:#fff;border-radius:99px;padding:0 8px;font-size:14px}
.ci.p{background:linear-gradient(#fff7d1,#fff)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);z-index:40;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:8px 14px;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s;width:max-content;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#catchX{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:16;display:none}
#catchX.on{display:grid}
#cTip{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 28px);text-align:center;z-index:16;font-size:24px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;display:none;pointer-events:none}
#cTip.on{display:block}
@media (orientation:landscape) and (max-height:520px){#title h1{font-size:34px}.fr{display:none}.sl{width:36px;height:36px}.bb{min-height:48px}}
</style>

function onOri(e){if(e.alpha==null||e.beta==null)return;ORI.alpha=e.alpha*Math.PI/180;ORI.beta=e.beta*Math.PI/180;ORI.gamma=e.gamma*Math.PI/180;ORI.got=true}
function wantOri(){const D=window.DeviceOrientationEvent;if(!D)return Promise.resolve(false);if(typeof D.requestPermission==='function')return D.requestPermission().then(r=>r==='granted').catch(()=>false);return Promise.resolve(true)}
const zee=new T.Vector3(0,0,1),q1=new T.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),q0=new T.Quaternion(),eu=new T.Euler(),qs=new T.Quaternion(),qy=new T.Quaternion(),qp=new T.Quaternion(),qt=new T.Quaternion(),VY=new T.Vector3(0,1,0),VX=new T.Vector3(1,0,0);
let dragYaw=0,dragPitch=0;
function updLook(){if(ORI.on&&ORI.got){const o=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*Math.PI/180;eu.set(ORI.beta,ORI.alpha,-ORI.gamma,'YXZ');qs.setFromEuler(eu);qs.multiply(q1);qs.multiply(q0.setFromAxisAngle(zee,-o));if(ORI.yaw0===null){eu.setFromQuaternion(qs,'YXZ');ORI.yaw0=eu.y}qy.setFromAxisAngle(VY,dragYaw-ORI.yaw0);qt.copy(qy).multiply(qs);cam.quaternion.slerp(qt,.4)}
 else{qy.setFromAxisAngle(VY,dragYaw);qp.setFromAxisAngle(VX,dragPitch);qt.copy(qy).multiply(qp);cam.quaternion.slerp(qt,.5)}}
let ptr=null;
cv.addEventListener('pointerdown',e=>{if(G.s!=='play')return;initAudio();ptr={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now(),moved:0};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!ptr)return;const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;ptr.moved+=Math.abs(dx)+Math.abs(dy);ptr.x=e.clientX;ptr.y=e.clientY;const k=cam.fov*Math.PI/180/innerHeight;dragYaw+=dx*k;if(!(ORI.on&&ORI.got))dragPitch=clamp(dragPitch+dy*k,-1.3,1.3)});
const pUp=e=>{if(!ptr)return;const p=ptr;ptr=null;if(p.moved<14&&performance.now()-p.t<600)tapAt(p.sx,p.sy)};cv.addEventListener('pointerup',pUp);cv.addEventListener('pointercancel',()=>{ptr=null});

/* ---------- 게임 ---------- */
const G={s:'title',mode:'virtual',list:[],an:[],hintT:0,hintCd:0,pingT:2,catch:null,hot:0};
const HIT=1.25;
function dirToPos(az,el,d){return new T.Vector3(Math.sin(az)*Math.cos(el)*d,Math.sin(el)*d,-Math.cos(az)*Math.cos(el)*d)}
function pickSpots(n){const fwd=new T.Vector3();cam.getWorldDirection(fwd);const res=[];let tries=0,minF=.95,minA=.8;while(res.length<n){tries++;if(tries>300){minF=.5;minA=.4}if(tries>900){minF=0;minA=.2}const az=rand(0,TAU),el=rand(-.45,.65),d=rand(4.2,7.2),p=dirToPos(az,el,d),dir=p.clone().normalize();if(dir.angleTo(fwd)<minF)continue;if(res.some(q=>q.clone().normalize().angleTo(dir)<minA))continue;res.push(p)}return res}
function makeAnimal(t){const root=new T.Group(),doll=buildDoll(t),d=DOLLS[t],rare=d.tier===3;doll.scale.setScalar(.74/d.r);root.add(doll);
 const bub=new T.Mesh(new T.SphereGeometry(1.0,28,18),new T.MeshBasicMaterial({color:rare?0xffe27a:0xbfe9ff,transparent:true,opacity:rare?.26:.2,depthWrite:false}));root.add(bub);
 const rim=new T.Mesh(new T.SphereGeometry(1.0,28,18),new T.MeshBasicMaterial({color:rare?0xffd23f:0xffffff,transparent:true,opacity:rare?.4:.3,side:T.BackSide,depthWrite:false}));rim.scale.setScalar(1.03);root.add(rim);
 const hl=new T.Mesh(new T.SphereGeometry(.14,12,8),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.75,depthWrite:false}));hl.position.set(-.5,.58,.5);hl.scale.set(1.5,.7,.5);root.add(hl);
 scene.add(root);return{t,root,doll,bub,pos:new T.Vector3(),caught:false,ph:rand(0,TAU),rare}}
function newRound(){for(const a of G.an)scene.remove(a.root);G.an=[];const prem=[0,1,2].sort(()=>Math.random()-.5),norm=[3,4,5,6,7,8,9,10].sort(()=>Math.random()-.5);const r=Math.random(),nP=r<.15?2:r<.65?1:0;const list=[];for(let i=0;i<nP;i++)list.push(prem[i]);while(list.length<6)list.push(norm.pop());list.sort(()=>Math.random()-.5);
 const spots=pickSpots(6);list.forEach((t,i)=>{const a=makeAnimal(t);a.pos.copy(spots[i]);a.root.position.copy(a.pos);a.root.lookAt(0,0,0);G.an.push(a)});buildSlots();G.hintT=0;G.pingT=2.5}
function buildSlots(){$('slots').innerHTML=G.an.map(a=>`<div class="sl ${a.caught?'ok':''}"><img alt="" src="${PREV[a.t]}"></div>`).join('')}
function nearest(){const fwd=new T.Vector3();cam.getWorldDirection(fwd);let best=null,ba=9;for(const a of G.an){if(a.caught)continue;const ang=fwd.angleTo(a.pos.clone().normalize());if(ang<ba){ba=ang;best=a}}return best?{a:best,ang:ba}:null}
function tapAt(x,y){if(G.s!=='play')return;const ray=new T.Raycaster();ray.setFromCamera(new T.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),cam);let best=null,bd=9;for(const a of G.an){if(a.caught)continue;const v=a.root.position.clone().sub(ray.ray.origin);if(v.dot(ray.ray.direction)<=0)continue;const d=ray.ray.distanceToPoint(a.root.position);if(d<HIT&&d<bd){bd=d;best=a}}
 if(best){sfx.found();vib(30);startCatch(best)}else{sfx.tap();emit(...rayPt(ray,4),0,0,0,.5,.3,0xffffff,0)}}
function rayPt(ray,d){const p=ray.ray.origin.clone().add(ray.ray.direction.clone().multiplyScalar(d));return[p.x,p.y,p.z]}

/* ---------- 잡기 ---------- */
function startCatch(a){G.s='catch';const d=DOLLS[a.t];for(const o of G.an)o.root.visible=false;const disp=buildDoll(a.t),cg=new T.Group();disp.scale.setScalar(1.25);cg.add(disp);cg.position.set(0,-.05,-2.7);cam.add(cg);
 G.catch={a,cg,disp,t:0,fails:0,tier:d.tier,per:d.tier===3?1.05:d.tier===2?1.35:1.7,ph:0,done:false,shake:0,jump:0,txt:'',txtT:0};
 $('catchX').classList.add('on');$('cTip').classList.add('on');cc.classList.add('on');$('hud').classList.remove('on');setBGM(false);burst(cg.getWorldPosition(new T.Vector3()),24,[0xffffff,0xffe27a,0xbfe9ff],3,0,.1)}
function catchTap(){const C=G.catch;if(!C||C.done)return;const Rt=Math.min(CW,CHt)*.2,Rr=ringR(C,Rt);const err=Math.abs(Rr-Rt)/Rt;const tol=(C.tier===3?.14:C.tier===2?.19:.26)+Math.min(C.fails,5)*.04;
 if(err<=tol){C.done=true;C.txt=err<tol*.45?'완벽!':'좋아요!';C.txtT=1;catchOk()}else{C.fails++;C.shake=.6;C.txt=Rr>Rt?'너무 일찍!':'너무 늦었어요!';C.txtT=.9;C.ph=0;sfx.oops();vib([40,30,40])}}
function ringR(C,Rt){const p=C.ph;return Rt*(1+2.3*(1-clamp(p,0,1.0)))}
cc.addEventListener('pointerdown',e=>{e.preventDefault();if(G.s==='catch')catchTap()});
addEventListener('keydown',e=>{if(e.code==='Space'&&G.s==='catch'){catchTap();e.preventDefault()}});
function catchOk(){const C=G.catch,a=C.a,d=DOLLS[a.t];sfx.win();vib([80,40,80,40,200]);flash('rgba(255,255,255,.9)',.7);C.jump=1;burst(C.cg.getWorldPosition(new T.Vector3()),70,CONF,5,3);$('catchX').classList.remove('on');$('cTip').classList.remove('on');
 SV.col[a.t]=(SV.col[a.t]||0)+1;save();a.caught=true;
 setTimeout(()=>{G.s='reveal';cc.classList.remove('on');$('rvStar').textContent='★'.repeat(d.tier)+'☆'.repeat(3-d.tier);$('rvT').textContent=d.n+'와 친구가 됐어요!';$('rvS').textContent=d.a+(d.tier===3?' · 제일 만나기 어려운 친구예요!':'');const left=G.an.filter(x=>!x.caught).length;$('rvOk').textContent=left?`다음 친구 찾기 (${left}마리 남음)`:'결과 보기!';$('cardM').classList.add('on');sfx.fan()},1100)}
$('rvOk').onclick=()=>{sfx.click();$('cardM').classList.remove('on');endCatch();const left=G.an.filter(x=>!x.caught).length;if(left){G.s='play';$('hud').classList.add('on');setBGM(true);buildSlots()}else roundDone()};
function endCatch(){const C=G.catch;if(!C)return;cam.remove(C.cg);C.disp.traverse(o=>{if(o.geometry)o.geometry.dispose()});G.catch=null;for(const o of G.an)o.root.visible=!o.caught;cc.classList.remove('on');$('catchX').classList.remove('on');$('cTip').classList.remove('on')}
$('catchX').onclick=()=>{if(G.s!=='catch')return;sfx.click();endCatch();G.s='play';$('hud').classList.add('on');setBGM(true);toast('괜찮아요! 다시 눌러서 잡아 봐요')};
function roundDone(){G.s='done';SV.rounds++;save();$('hud').classList.remove('on');$('doneRow').innerHTML=G.an.map(a=>`<img alt="" src="${PREV[a.t]}">`).join('');$('done').classList.add('on');sfx.fan();vib([100,60,100,60,300]);for(let i=0;i<4;i++)setTimeout(()=>{const f=new T.Vector3(0,0,-1).applyQuaternion(cam.quaternion).multiplyScalar(4).add(new T.Vector3(rand(-2,2),rand(-1,2),0));burst(f,50,CONF,5,3)},i*350)}
$('again').onclick=()=>{sfx.start();$('done').classList.remove('on');newRound();G.s='play';$('hud').classList.add('on');setBGM(true);toast('새로운 동물 친구들이 숨었어요!')};
$('doneCol').onclick=()=>{sfx.click();openCol()};

/* ---------- 도감 ---------- */
function openCol(){const own=Object.keys(SV.col).length;$('colSum').textContent=`모은 동물 ${own}/${DOLLS.length}종 · 별 3개는 만나기 아주 어려운 친구예요`;$('colG').innerHTML=DOLLS.map((d,i)=>{const n=SV.col[i]||0;return`<div class="ci ${n?'':'no'} ${d.tier===3?'p':''}"><img alt="" src="${PREV[i]}">${n?`<span class="n">${n}</span>`:''}<b>${n?d.n:'???'}</b><small>${'★'.repeat(d.tier)} ${d.a}</small></div>`}).join('');$('colS').classList.add('on')}
$('colBtn').onclick=()=>{initAudio();sfx.click();if(G.s==='play')G.s='col';openCol()};
$('cClose').onclick=()=>{sfx.click();$('colS').classList.remove('on');if(G.s==='col')G.s='play'};
$('muteBtn').onclick=()=>{initAudio();AU.muted=!AU.muted;if(AU.m)AU.m.gain.value=AU.muted?0:.8;$('muteBtn').textContent=AU.muted?'×':'♪';$('muteBtn').setAttribute('aria-label',AU.muted?'소리 켜기':'소리 끄기')};

/* ---------- 버튼 ---------- */
$('hintBtn').onclick=()=>{if(G.s!=='play'||G.hintCd>0)return;initAudio();sfx.hint();vib(20);G.hintT=4;G.hintCd=7};
$('roomBtn').onclick=()=>{if(G.s!=='play')return;initAudio();const left=G.an.filter(a=>!a.caught);if(!left.length)return;sfx.whoosh();vib([30,30,60]);flash('rgba(255,255,255,.8)',.6);const sp=pickSpots(left.length);left.forEach((a,i)=>{burst(a.root.position,14,[0xbfe9ff,0xffffff],2,0,.1);a.pos.copy(sp[i]);a.root.position.copy(a.pos);a.root.lookAt(0,0,0);burst(a.pos,14,[0xbfe9ff,0xffffff],2,0,.1)});msg('새로 숨었어요!','#ffd23f');toast('새로운 방에서 동물 친구들이 다시 숨었어요')};

/* ---------- 시작 ---------- */
$('frow').innerHTML=[0,1,2,3,4,5,6,7].map(i=>`<img alt="" src="${PREV[i]}">`).join('');
async function startCam(){try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return false;const s=await Promise.race([navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}),new Promise((_,rj)=>setTimeout(rj,15000))]);vid.srcObject=s;vid.style.display='block';try{await vid.play()}catch(e){}return true}catch(e){return false}}
async function begin(useCam){$('startBtn').disabled=$('noCamBtn').disabled=true;initAudio();sfx.start();const pOri=wantOri();const camOk=useCam?await startCam():false;const oriOk=await pOri;
 if(oriOk){addEventListener('deviceorientation',onOri,true);addEventListener('deviceorientationabsolute',onOri,true);await new Promise(r=>setTimeout(r,800));ORI.on=ORI.got}
 G.mode=camOk?'camera':'virtual';if(!camOk)addRoom();
 const tip=camOk?(ORI.on?'폰을 천천히 돌려서 찾아봐요. 걸을 때는 앞을 잘 봐요!':'화면을 손가락으로 밀어서 둘러봐요'):(ORI.on?'폰을 돌려서 가상의 방을 둘러봐요':'화면을 손가락으로 밀어서 가상의 방을 둘러봐요');
 $('tip').textContent=tip;if(useCam&&!camOk)toast('카메라를 쓸 수 없어서 가상의 방에서 놀아요',3800);
 $('title').classList.remove('on');$('hud').classList.add('on');$('reticle').style.display='block';newRound();G.s='play';setBGM(true);$('startBtn').disabled=$('noCamBtn').disabled=false}
$('startBtn').onclick=()=>begin(true);$('noCamBtn').onclick=()=>begin(false);

/* ---------- 루프 ---------- */
const hotTxt=[[.2,'바로 앞이에요! 톡 눌러요'],[.6,'뜨거워요! 거의 다 왔어요'],[1.1,'따뜻해요'],[1.7,'미지근해요'],[2.4,'차가워요'],[9,'아주 차가워요! 반대쪽을 봐요']];
let last=performance.now(),bt=0;
const _v=new T.Vector3(),_q=new T.Quaternion();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;bt+=dt;try{
 updLook();
 for(const a of G.an){if(a.caught)continue;const k=bt*1.5+a.ph;a.root.position.set(a.pos.x,a.pos.y+Math.sin(k)*.14,a.pos.z);a.root.lookAt(0,0,0);a.doll.rotation.z=Math.sin(k*1.3)*.1;a.doll.rotation.y=Math.sin(k*.7)*.35;a.bub.scale.setScalar(1+Math.sin(k*2)*.02);if(a.rare&&Math.random()<.12)emit(a.root.position.x+rand(-.9,.9),a.root.position.y+rand(-.9,.9),a.root.position.z+rand(-.9,.9),0,.4,0,1,.2,0xffe27a,0)}
 if(G.s==='play'){G.hintCd=Math.max(0,G.hintCd-dt);const b=$('hintBtn');b.disabled=G.hintCd>0;b.innerHTML=G.hintCd>0?`힌트 준비 중<br>${Math.ceil(G.hintCd)}초`:'힌트<br>화살표';
  const n=nearest();if(n){G.hot=1-n.ang/Math.PI;const tx=hotTxt.find(h=>n.ang<h[0])[1];$('mTxt').textContent=tx;const f=$('mFill');f.style.width=Math.round(8+G.hot*92)+'%';f.style.background=`hsl(${Math.round(210-205*G.hot)},90%,55%)`;
   G.pingT-=dt;if(G.pingT<=0){_v.copy(n.a.pos).normalize().applyQuaternion(_q.copy(cam.quaternion).invert());const pan=clamp(_v.x*1.4,-1,1),vol=clamp(.35+G.hot*.9,.3,1)*(_v.z>0?.7:1);ping(n.a.t,pan,vol,n.a.rare);G.pingT=lerp(.8,3.4,clamp(n.ang/Math.PI,0,1))}
   G.hintT=Math.max(0,G.hintT-dt);const ar=$('arrow');if(G.hintT>0&&n.ang>.25){_v.copy(n.a.pos).applyQuaternion(_q.copy(cam.quaternion).invert());const ang=Math.atan2(_v.x,_v.y);ar.style.display='block';$('arrowI').style.transform=`rotate(${ang}rad) scale(${1+Math.sin(bt*8)*.08})`}else ar.style.display='none';$('reticle').style.borderColor=n.ang<.2?'#ffd23f':'rgba(255,255,255,.85)'}}
 else $('arrow').style.display='none';
 // 잡기 화면
 const C=G.catch;cx2.clearRect(0,0,CW,CHt);
 if(C){C.t+=dt;if(!C.done){C.ph+=dt/C.per*(C.fails>=3?.88:1);if(C.ph>1.18)C.ph=0}
  C.shake=Math.max(0,C.shake-dt*1.4);C.cg.position.x=Math.sin(bt*60)*.08*C.shake;let y=-.05+Math.abs(Math.sin(bt*3))*.1;if(C.jump>0){C.jump=Math.max(0,C.jump-dt*1.1);y+=Math.sin((1-C.jump)*Math.PI*3)*.5*C.jump*2;C.cg.rotation.y+=dt*8}else C.cg.rotation.y=Math.sin(bt*2)*.25;C.cg.position.y=y;
  if(!C.done){const Rt=Math.min(CW,CHt)*.2,Rr=ringR(C,Rt),px=CW/2,py=CHt*.5;const err=Math.abs(Rr-Rt)/Rt;const tol=(C.tier===3?.14:C.tier===2?.19:.26)+Math.min(C.fails,5)*.04;const good=err<=tol;
   cx2.lineWidth=14;cx2.strokeStyle='rgba(29,18,54,.7)';cx2.beginPath();cx2.arc(px,py,Rt,0,TAU);cx2.stroke();cx2.lineWidth=9;cx2.strokeStyle=good?'#ffd23f':'#16d39a';cx2.beginPath();cx2.arc(px,py,Rt,0,TAU);cx2.stroke();
   cx2.lineWidth=12;cx2.strokeStyle='rgba(29,18,54,.7)';cx2.beginPath();cx2.arc(px,py,Rr,0,TAU);cx2.stroke();cx2.lineWidth=7;cx2.strokeStyle=good?'#fff':'#ff4d8d';cx2.beginPath();cx2.arc(px,py,Rr,0,TAU);cx2.stroke()}
  if(C.txtT>0){C.txtT-=dt;cx2.font='54px Jua, sans-serif';cx2.textAlign='center';cx2.lineJoin='round';cx2.lineWidth=10;cx2.strokeStyle='#1d1236';cx2.fillStyle=C.done?'#ffd23f':'#fff';cx2.globalAlpha=clamp(C.txtT*2,0,1);cx2.strokeText(C.txt,CW/2,CHt*.2);cx2.fillText(C.txt,CW/2,CHt*.2);cx2.globalAlpha=1}}
 stepParts(dt);bgmTick();R.render(scene,cam)}catch(e){console.warn(e)}}
requestAnimationFrame(loop);
document.addEventListener('touchmove',e=>{if(!e.target.closest('.screen.on'))e.preventDefault()},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){BGM.on=false}else if(AU.c&&(G.s==='play')){setBGM(true)}});
cv.addEventListener('webglcontextlost',e=>{e.preventDefault();toast('화면을 다시 불러오는 중이에요')},false);
window.__g={G,SV,cam,ORI,begin,tapAt,startCatch,catchTap,get C(){return G.catch},setLook(y,p){dragYaw=y;dragPitch=p;cam.quaternion.setFromEuler(new T.Euler(p,y,0,'YXZ'))},nearest,newRound};
}
